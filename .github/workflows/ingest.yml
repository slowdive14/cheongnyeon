# 정책 자동 수집 배치 (Phase A) — 온통청년 전량 증분 인제스트 → Supabase.
#
# 주기: ⚠️ 한시적 매일 12:00 KST (= 03:00 UTC). 수동 실행(workflow_dispatch) 가능.
#       사유: 무료 등급 TPM 한도로 임베딩 결손 664건이 1회 실행당 일부(~80건)씩만 메워진다.
#       백필 완료(embedding is null = 0) 후 '0 3 * * 1,4'(주 2회 월·목 12:00 KST)로 되돌릴 것.
# 증분: contentHash 기반 — 변경분만 Gemini(파싱·설명·임베딩) 호출. 평시 비용 몇 원 수준.
# 실패 알림: Actions 기본 실패 메일(저장소 소유자). 로그 요약은 Step Summary에 기록.
#
# 필요 Secrets (Settings → Secrets and variables → Actions):
#   ONTONG_API_KEY / GEMINI_API_KEY / SUPABASE_URL / SUPABASE_SERVICE_KEY
name: ingest-policies

on:
  schedule:
    - cron: '0 3 * * *' # 매일 03:00 UTC = 12:00 KST (백필 기간 한시. 복귀값: '0 3 * * 1,4')
  workflow_dispatch:
    inputs:
      force_explain:
        description: '혜택 한 줄(D-②) 전체 재생성 — 프롬프트 목적 변경 시 1회성(~$1). 평소 false.'
        type: boolean
        default: false

# 동시 실행 방지(중복 적재 금지). 진행 중이면 새 실행은 대기·중복 취소 없이 직렬화.
concurrency:
  group: ingest-policies
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # 전량 재처리(최악) ~44분 + 여유. 증분 평시는 수 분.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ingest (incremental)
        env:
          ONTONG_API_KEY: ${{ secrets.ONTONG_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          INGEST_CONCURRENCY: '12'
          # 서울 청년몽땅 합류(Phase B) — ✅ 재개방(서울시 승인 취득, 2026-11-02).
          #   경위: 청년몽땅 이용약관(제12조③·제13조 — 배포·제3자 제공·가공 시 서울시 명시적 승인 필요)
          #        상 승인 미취득이라 2026-07-13 수집 중단 + 기존 서울분 310건 DB purge.
          #        2026-11-02 운영자가 서울시 승인을 취득하여 재개방한다.
          #   재개방 동작: seoulClient가 다시 크롤·적재(서울시+자치구 ~300건 규모). 카드 출처는 '(청년몽땅)' 표기.
          #   근거: _workspace/40_B0_recon.md §4.
          SEOUL_INGEST: 'on' # ''=off(비활성) · 'on'=재개방.
          # 혜택 한 줄(D-②) 전체 재생성 — 수동 실행에서 force_explain=true일 때만 'on'. 정기(cron)은 항상 off.
          INGEST_FORCE_EXPLAIN: ${{ inputs.force_explain && 'on' || '' }}
        run: |
          set -o pipefail
          npm run ingest 2>&1 | tee ingest.log

      - name: Write run summary
        if: always()
        run: |
          {
            echo "## 인제스트 실행 요약"
            echo '```'
            tail -n 40 ingest.log 2>/dev/null || echo "(로그 없음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
